<!DOCTYPE html>
<html>
<head>
  <title>Site Sem Acessibilidade</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .topo { font-size: 24px; font-weight: bold; margin-bottom: 20px; }
    .texto-fraco { color: #b5b5b5; background: #ffffff; }
    .botao-falso { 
      background: #007bff; 
      color: white; 
      padding: 10px 15px; 
      display: inline-block; 
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="topo">Portal de Notícias</div>
  
  <div class="conteudo">
    <img src="https://via.placeholder.com/300x150">
    <p class="texto-fraco">Leia as novidades de tecnologia da semana.</p>
    
    <input type="text" placeholder="Seu e-mail">
    <div class="botao-falso" onclick="alert('Enviado!')">Assinar</div>
  </div>
</body>
</html>
