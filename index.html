<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Notícias — Acessível</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Portal de Notícias</h1>
  </header>

  <main>
    <article>
      <img src="https://via.placeholder.com/300x150" alt="Banner ilustrativo sobre novidades de tecnologia">
      <p class="texto-legivel">Leia as novidades de tecnologia da semana.</p>

      <form onsubmit="event.preventDefault(); alert('Inscrição realizada com sucesso!');">
        <label for="email-usuario">Digite seu e-mail para receber novidades:</label>
        <input type="email" id="email-usuario" name="email" placeholder="exemplo@email.com" required>
        <button type="submit">Assinar</button>
      </form>
    </article>
  </main>
</body>
</html>
